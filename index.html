<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Паспорт путешественника по Беларуси</title>
  <meta name="theme-color" content="#2c3e50">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="onboarding-overlay">
    <div class="onboarding-content">
      <h1 class="onboarding-title">Добро пожаловать в Паспорт путешественника!</h1>
      <p class="onboarding-subtitle">Отмечайте города Беларуси, которые вы посетили</p>
      <input type="text" id="onboarding-name-input" class="onboarding-input" placeholder="Ваше имя" maxlength="50" autocomplete="off">
      <div class="onboarding-buttons">
        <button id="onboarding-continue" class="onboarding-btn onboarding-btn-primary">Продолжить</button>
        <button id="onboarding-skip" class="onboarding-btn onboarding-btn-secondary">Пропустить</button>
      </div>
    </div>
  </div>

  <div id="app">
    <div id="tab-passport" class="tab-content">
      <div class="passport-sticky-header">
        <header class="passport-header">
          <h1>Мой паспорт</h1>
          <div class="passport-progress">
            <span id="passport-count" class="passport-count">0 из 57</span>
          </div>
        </header>
        <div class="passport-controls">
          <form class="passport-search-form">
            <input type="search" id="passport-search" placeholder="Поиск города..." autocomplete="off">
          </form>
          <div class="passport-filter-tabs">
            <button class="passport-filter-btn active" data-filter="all">Все</button>
            <button class="passport-filter-btn" data-filter="visited">Посещённые</button>
            <button class="passport-filter-btn" data-filter="unvisited">Непосещённые</button>
            <button class="passport-filter-btn" data-filter="planned">В планах</button>
          </div>
        </div>
      </div>
      <div id="passport-list"></div>
    </div>
    <div id="tab-map" class="tab-content">
      <header class="map-header">
        <h1>Карта Беларуси</h1>
      </header>
      <div class="map-controls">
        <button class="map-filter-btn active" data-map-filter="all">Все города</button>
        <button class="map-filter-btn" data-map-filter="visited">Посещённые</button>
        <button class="map-filter-btn" data-map-filter="planned">В планах</button>
      </div>
      <div id="map-container">
        <svg id="belarus-map" viewBox="1.472 1.809 1626.241 1450.672" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
          <path d="M 73.16,677.84 L 233.46,679.76 413.51,573.55 452,414.39 587.96,324.12 572.38,197.84 673.24,150.41 851.4,41.64 1026,112.35 1049.56,182.33 1136.58,148.68 1298.71,215.92 1314.95,348.26 1279.41,424.31 1383.39,608.89 1450.88,660.32 1440.9,711.24 1552.73,760.85 1600.5,836.02 1535.97,897.68 1402.15,887.89 1370.24,914.23 1409.18,1007.82 1449.98,1188.35 1307.61,1205.08 1256.51,1266.97 1245.84,1408.86 1179.88,1381.62 1030.21,1395.13 986.75,1329.21 924.52,1378.36 862.16,1337.62 731.55,1331.96 546.45,1264.3 378.92,1242.21 250.44,1248.46 159.55,1324.87 80.28,1335.86 77.12,1210.35 25.95,1079.73 125.41,1022.18 126.36,909.8 80.36,802.56 73.16,677.84 Z" fill="#e8e8e8" stroke="#ccc" stroke-width="1"/>
          <g id="map-points-layer"></g>
        </svg>
        <div id="map-empty-overlay" class="map-empty-overlay" style="display:none;">
          <p id="map-empty-overlay-text"></p>
        </div>
        <div class="map-zoom-controls" id="map-zoom-controls">
          <button class="map-zoom-btn" id="map-zoom-in" aria-label="Приблизить">+</button>
          <button class="map-zoom-btn" id="map-zoom-out" aria-label="Уменьшить">&#8722;</button>
        </div>
      </div>
    </div>
    <div id="tab-profile" class="tab-content"></div>

    <nav id="tab-bar">
      <button class="tab-btn active" data-tab="passport">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="13" y2="13"/></svg>
        <span>Паспорт</span>
      </button>
      <button class="tab-btn" data-tab="map">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
        <span>Карта</span>
      </button>
      <button class="tab-btn" data-tab="profile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Профиль</span>
      </button>
    </nav>
  </div>

  <div id="city-card-overlay" style="display:none">
    <div id="city-card-content"></div>
  </div>

  <div id="date-picker-modal" style="display:none">
    <div id="date-picker-content"></div>
  </div>
  <div id="stamp-overlay" style="display:none">
    <div id="stamp-overlay-content"></div>
  </div>

  <div id="toast" style="display:none"></div>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
