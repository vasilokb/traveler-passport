<script>
var MAP = {
  pathMinX: 119.2, pathMinY: 1114.4,
  pathW: 1508.6, pathH: 338.1,
  geoN: 56.4, geoS: 51.1, geoW: 22.9, geoE: 33.0
};
function projectToSVG(lat, lon) {
  return {
    x: MAP.pathMinX + ((lon - MAP.geoW) / (MAP.geoE - MAP.geoW)) * MAP.pathW,
    y: MAP.pathMinY + ((MAP.geoN - lat) / (MAP.geoN - MAP.geoS)) * MAP.pathH
  };
}

var cities = [
  ['Brest', 52.097, 23.685, 'red'],
  ['Vitebsk', 55.184, 30.205, 'blue'],
  ['Grodno', 53.669, 23.823, 'green'],
  ['Minsk', 53.901, 27.559, 'orange'],
  ['Gomel', 52.435, 30.988, 'purple'],
  ['Polotsk', 55.485, 28.761, 'cyan']
];

var layer = document.getElementById('map-points-layer');
var pathBbox = document.getElementById('border-path').getBBox();
var info = ['Path bbox: x=' + pathBbox.x.toFixed(0) + ' y=' + pathBbox.y.toFixed(0) + ' w=' + pathBbox.width.toFixed(0) + ' h=' + pathBbox.height.toFixed(0)];

cities.forEach(function(c) {
  var p = projectToSVG(c[1], c[2]);
  info.push(c[0] + ': svg(' + p.x.toFixed(1) + ',' + p.y.toFixed(1) + ')');
  var circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  circle.setAttribute('cx', p.x);
  circle.setAttribute('cy', p.y);
  circle.setAttribute('r', '8');
  circle.setAttribute('fill', c[3]);
  layer.appendChild(circle);
  
  var text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  text.setAttribute('x', p.x + 10);
  text.setAttribute('y', p.y + 4);
  text.setAttribute('font-size', '16');
  text.setAttribute('fill', c[3]);
  text.textContent = c[0];
  layer.appendChild(text);
});

document.getElementById('output').textContent = info.join('\n');
</script>
<pre id="output"></pre>
